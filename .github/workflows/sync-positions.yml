name: Sync Positions from Greeting

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 오전 10시 KST
  workflow_dispatch:      # 수동 실행 가능

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch openings from Greeting API
        run: |
          curl -s \
            -H "X-Greeting-OpenAPI: ${{ secrets.GREETING_API_KEY }}" \
            -H "X-Api-Version: 2.0" \
            "https://oapi.greetinghr.com/openapi/openings?page=0&pageSize=100&status=OPEN" \
            > greeting_response.json
          echo "API response:"
          cat greeting_response.json | head -c 500

      - name: Generate positions.js
        run: node scripts/generate-positions.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions.js
          git diff --staged --quiet || (git commit -m "chore: sync positions from Greeting API" && git push)
